<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>auto-d: mobile app prototype</title>
<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Helvetica,Arial,sans-serif;color:#000;display:flex;justify-content:center;overflow:hidden;user-select:none;-webkit-user-select:none}
#stage{width:100%;max-width:480px;height:100%}
.phone{width:100%;height:100%;background:var(--bg);overflow:hidden;position:relative;box-shadow:0 0 0 1px #0001}
.screen{position:absolute;inset:0;overflow:hidden}
.sb{height:10px}

.scan{background:#000;color:#fff}

.ctl .l,.ctl .r{position:absolute;top:110px;font-size:17px;cursor:pointer}.ctl .l{left:24px}.ctl .r{right:24px;color:#ffd60a;font-weight:600}
.tog{display:inline-flex;align-items:center;gap:7px;cursor:pointer;font-size:15px}
.sw{width:40px;height:24px;border-radius:12px;background:#555;position:relative;transition:.2s}.sw:after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}.sw.on{background:#30d158}.sw.on:after{left:18px}
/* crop */
.crop{background:#000;color:#fff}
.cbox{position:absolute;left:50%;transform:translateX(-50%);top:90px;height:calc(100% - 250px);aspect-ratio:3/4;max-width:calc(100% - 48px);touch-action:none}
.cbox .pg{position:absolute;inset:0}.cbox .pg svg{width:100%;height:100%;display:block}
.cbox .ov{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.hd{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:#ffd60a;border:3px solid #fff;box-shadow:0 2px 8px #0008;touch-action:none;cursor:grab}
.cbar{position:absolute;left:0;right:0;bottom:0;height:140px;background:#1c1c1e;display:flex;justify-content:space-around;align-items:center;padding:0 10px 20px}
.cbar button{background:none;border:0;color:#fff;font:inherit;font-size:13px;text-align:center;cursor:pointer;padding:6px}
.cbar button b{display:block;font-size:22px;margin-bottom:2px}
.cbar .done{color:#ffd60a;font-weight:600}.cbar .del{color:#ff6961}
/* pages */
.docc{background:var(--card);margin:0 16px 14px;border-radius:16px;padding:12px;transition:box-shadow .15s,background .15s}
.docc.over,.newz.over,.loosez.over{box-shadow:0 0 0 3px var(--blue);background:#eaf3ff}
.dh{display:flex;align-items:center;gap:8px;margin-bottom:10px}.dh b{font-size:17px;flex:1}
.chip{display:inline-flex;align-items:center;gap:5px;background:#e8f1ff;color:var(--blue);border-radius:12px;padding:5px 11px;font-size:13px;font-weight:500;cursor:pointer;margin-top:10px}
.gridp{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;min-height:84px}
.tile{position:relative;aspect-ratio:3/4;touch-action:none;cursor:grab;border-radius:6px;box-shadow:0 1px 4px #0003;background:#e5e5ea;overflow:hidden}
.tile .n{position:absolute;left:4px;top:3px;font-size:10px;font-weight:700;background:#000a;color:#fff;border-radius:7px;padding:0 5px;z-index:2}
.tile.lift{opacity:.25}.tile.ghost{position:fixed;z-index:9999;pointer-events:none;opacity:.95;transform:rotate(5deg) scale(1.12);box-shadow:0 14px 24px #0006;margin:0}
.newz,.loosez{border:2px dashed #b0b0b8;border-radius:16px;margin:0 16px 14px;padding:12px;background:transparent;color:var(--l2);text-align:center;font-size:15px}
.loosez{text-align:left;background:#fff6;border-color:#c9c9d0}
.empty{text-align:center;color:var(--l2);padding:60px 36px;font-size:16px;line-height:1.4}.empty .big{font-size:56px;margin-bottom:6px}
/* sync */
.bar{height:6px;border-radius:3px;background:#e5e5ea;margin-top:7px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue);transition:width .4s}
.bar i.rd{background:var(--purple);animation:ind 1.1s infinite linear;background-image:linear-gradient(90deg,#5856d6 25%,#a5a3f5 50%,#5856d6 75%);background-size:200% 100%}
@keyframes ind{to{background-position:-200% 0}}
/* review */
.deck{position:absolute;left:16px;right:16px;top:96px;bottom:178px;max-height:520px}
.k{position:absolute;left:0;right:0;top:0;height:calc(100% - 28px);overflow:hidden;border-radius:26px;background:#fff;box-shadow:0 12px 30px #0002;padding:18px;transition:transform .3s,opacity .3s;touch-action:none;will-change:transform}
.k.k1{transform:translateY(14px) scale(.95);opacity:.85}.k.k2{transform:translateY(28px) scale(.9);opacity:.6}
.k.k1 *,.k.k2 *{visibility:hidden}
.k.k0{cursor:grab;z-index:5}
.k .h{font-size:24px;font-weight:700}.k .sub{font-size:14px;color:var(--l2);margin:2px 0 10px}
.prev{border-radius:12px;overflow:hidden;background:#eceff3;border:1px solid #e0e0e5}.prev svg{display:block;width:100%;max-height:168px}
.seg{display:flex;background:#7676801f;border-radius:9px;padding:2px;margin:4px 16px 0}
.seg div{flex:1;text-align:center;font-size:13px;font-weight:600;padding:7px 0;border-radius:7px;cursor:pointer}
.seg div.on{background:#fff;box-shadow:0 1px 3px #0003}
.tsw{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;background:#000a;border-radius:18px;padding:3px}
.tsw div{padding:7px 16px;border-radius:15px;font-size:13px;font-weight:600;cursor:pointer;color:#ddd;white-space:nowrap}
.tsw div.on{background:#ffd60a;color:#000}
.dhero{background:#fff;margin:0 16px;border-radius:16px;padding:14px;display:flex;gap:14px;align-items:center}
.dhero .th{width:84px;height:112px;flex:none;border-radius:8px;box-shadow:0 2px 8px #0003}
.dhero b{font-size:20px;display:block;margin-bottom:6px}
.pgs{display:flex;gap:10px;overflow-x:auto;padding:0 16px 4px}.pgs .th{width:72px;height:96px;flex:none;border-radius:8px;box-shadow:0 1px 4px #0003}
.pgs::-webkit-scrollbar{display:none}
.cell .rt{text-align:right;font-weight:600}
.fld{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:.5px solid #e5e5ea;font-size:16px}.fld:last-of-type{border:0}.fld span{color:var(--l2)}
.cf{font-size:11px;font-weight:700;border-radius:8px;padding:1px 6px;margin-left:7px;background:#d4f5dc;color:#1b8a3a}.cf.lo{background:#ffecc9;color:#b86e00}
.stamp{position:absolute;top:26px;font-size:22px;font-weight:800;border:4px solid;border-radius:10px;padding:1px 12px;opacity:0;pointer-events:none;letter-spacing:1px}
.st-ok{left:22px;color:var(--green);transform:rotate(-14deg)}.st-no{right:22px;color:var(--red);transform:rotate(14deg)}.st-ed{left:50%;margin-left:-34px;top:60px;color:var(--orange)}
.acts{position:absolute;left:0;right:0;bottom:84px;display:flex;justify-content:center;gap:26px}
.ab{text-align:center;font-size:12px;color:var(--l2);cursor:pointer}
.ab div{width:60px;height:60px;border-radius:50%;margin:0 auto 5px;display:flex;align-items:center;justify-content:center;background:#fff;box-shadow:0 2px 8px #0002}
.ab.main div{width:68px;height:68px;margin-top:-4px;background:var(--green)}
.ab svg{width:28px;height:28px;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.hint{position:absolute;left:0;right:0;bottom:70px;text-align:center;font-size:13px;color:var(--l2)}
/* fix */
.fx{background:#fff;margin:0 16px 12px;border-radius:16px;padding:14px}
.fx .top{display:flex;gap:12px;align-items:center}
/* overlays */
.ovl{position:absolute;inset:0;background:#0006;z-index:80;display:flex;flex-direction:column;justify-content:flex-end;animation:fi .2s}
@keyframes fi{from{opacity:0}to{opacity:1}}
.as{margin:0 10px 20px;animation:su .25s}
@keyframes su{from{transform:translateY(40px)}to{transform:none}}
.asg{background:#f9f9f9f2;border-radius:14px;overflow:hidden;margin-bottom:8px}
.ash{text-align:center;color:var(--l2);font-size:13px;padding:14px}
.asb{display:block;width:100%;padding:17px;border:0;border-top:.5px solid #cfcfd4;background:none;font:inherit;font-size:20px;color:var(--blue);cursor:pointer}
.asb.dst{color:var(--red)}.asb.cn{background:#fff;border-radius:14px;font-weight:600}
.edsheet{background:var(--bg);border-radius:22px 22px 0 0;padding:10px 0 34px;animation:su .25s}
.edsheet .grab{width:38px;height:5px;background:#c7c7cc;border-radius:3px;margin:0 auto 6px}
.edsheet input{border:0;background:none;text-align:right;font:inherit;font-size:17px;color:#000;width:55%;outline:none}
.toast{position:absolute;left:50%;top:14px;transform:translate(-50%,-30px);background:#1c1c1ee6;color:#fff;border-radius:22px;padding:10px 18px;font-size:14px;z-index:90;opacity:0;transition:.3s;white-space:nowrap;pointer-events:none}.toast.on{opacity:1;transform:translate(-50%,0)}
/* splash */
.splash{background:linear-gradient(160deg,#0a84ff,#5e5ce6);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
.logo{width:110px;height:110px;border-radius:28px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 20px 40px #0004;animation:pop .8s cubic-bezier(.2,1.4,.4,1)}
.logo svg{width:64px;height:64px;fill:none;stroke:#0a84ff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
.splash h1{font-size:36px;margin:22px 0 4px;animation:fi 1s}.splash p{margin:0;opacity:.85;font-size:17px;animation:fi 1.4s}
.ic2{width:56px;height:56px;stroke:#c4c4c7;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;display:block;margin:0 auto 10px}
.cbar svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block;margin:0 auto 4px}
</style></head><body>
<div id="stage"><div class="phone" id="phone"><div class="screen" id="screen"></div><div id="tabs"></div><div class="toast" id="toast"></div></div></div>
<script>
"use strict";
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const TYPES={
 pinv:{name:'Purchase invoice',short:'Purchase',entity:'Purchase invoice',attach:'Purchase Invoice › Attachment',party:'Supplier',fields:[['Supplier','Sri Traders',97],['Invoice no.','PINV-2043',95],['Date','14 Nov 2026',96],['Total','₹ 48,250.00',90]]},
 sinv:{name:'Sales invoice',short:'Sales',entity:'Sales invoice',attach:'Sales Invoice › Attachment',party:'Customer',fields:[['Customer','Anand & Co',96],['Invoice no.','SINV-0871',94],['Date','16 Nov 2026',97],['Total','₹ 1,12,400.00',91]]}
};
const TKEYS=Object.keys(TYPES);
const ATTACH=['Purchase Invoice › Attachment','Sales Invoice › Attachment','Supplier › File','Customer › File','No attachment'];
const fval=(d,l)=>{const f=d.fields.find(x=>x.label===l);return f?f.value:''};
const AUTO=[[2,2],[98,1],[99,98],[1,99]], FULL=[[0,0],[100,0],[100,100],[0,100]];
const S={screen:'splash',pages:{},loose:[],docs:[],nid:1,approved:0,auto:true,cropId:null,cropBack:'pages',syncing:false,cur:null,scanType:'pinv',flt:'all',detail:null};
const KEY='autod-proto-v2';
function save(){try{localStorage.setItem(KEY,JSON.stringify({pages:S.pages,loose:S.loose,docs:S.docs,nid:S.nid,approved:S.approved}))}catch(e){}}
function load(){try{const j=JSON.parse(localStorage.getItem(KEY)||'null');if(!j)return;Object.assign(S,{pages:j.pages,loose:j.loose,docs:j.docs,nid:j.nid,approved:j.approved});
 S.docs.forEach(d=>{if(['queued','uploading','reading'].includes(d.status)){d.status='draft';d.done=0}})}catch(e){}}
load();
const ic={
 inbox:'<path d="M4 13l2-8h12l2 8M4 13v6h16v-6M4 13h5l1 2h4l1-2h5"/>',
 pages:'<rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/>',
 cam:'<rect x="3" y="7" width="18" height="13" rx="3"/><path d="M8 7l1.5-3h5L16 7"/><circle cx="12" cy="13.5" r="3.5"/>',
 check:'<path d="M5 12l5 5L20 7"/>',warn:'<path d="M12 8v5M12 17h.01"/><circle cx="12" cy="12" r="9"/>',
 sync:'<path d="M4 12a8 8 0 0 1 14-5M20 12a8 8 0 0 1-14 5M18 3v4h-4M6 21v-4h4"/>',
 up:'<path d="M12 16V4M7 9l5-5 5 5M5 20h14"/>',doc:'<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/>',
 clip:'<path d="M21 11l-9 9a5 5 0 0 1-7-7l9-9a3.5 3.5 0 0 1 5 5l-9 9a2 2 0 0 1-3-3l8-8"/>',
 x:'<path d="M6 6l12 12M18 6L6 18"/>',pen:'<path d="M4 20h4L19 9l-4-4L4 16z"/>'
};
const svgi=(n,c='')=>`<svg viewBox="0 0 24 24" class="${c}">${ic[n]}</svg>`;
const chev='<svg class="chev" viewBox="0 0 8 14"><path d="M1 1l6 6-6 6"/></svg>';

/* ---------- paper drawing ---------- */
function paperInner(type,k,vals,boxes){
 const t=TYPES[type];let s='<rect width="300" height="400" fill="#fbfbf8"/>';
 s+='<rect x="20" y="22" width="110" height="11" rx="2" fill="#1c1c1e" opacity=".85"/>';
 s+=`<text x="20" y="58" font-size="12" font-weight="700" font-family="Helvetica,Arial" fill="#3a3a3c" letter-spacing="1">${t.name.toUpperCase()}</text>`;
 t.fields.forEach((f,i)=>{
  s+=`<text x="26" y="${102+36*i}" font-size="9" font-family="Helvetica,Arial" fill="#8e8e93">${f[0]}</text>`;
  s+=`<text x="26" y="${119+36*i}" font-size="15" font-weight="700" font-family="Helvetica,Arial" fill="#111">${(vals?vals[i]:f[1]).replace(/&/g,'&amp;')}</text>`;
  if(boxes)s+=`<rect x="18" y="${90+36*i}" width="${boxes[i]||200}" height="34" rx="4" fill="#34c75930" stroke="#34c759" stroke-width="2"/>`;
 });
 for(let i=0;i<9;i++){const w=90+((i*53+k*29)%170);s+=`<rect x="20" y="${232+i*15}" width="${w}" height="4" rx="2" fill="#d1d1d6"/>`}
 s+='<circle cx="240" cy="352" r="24" fill="none" stroke="#5856d6" stroke-width="3" opacity=".45"/><text x="240" y="356" font-size="9" text-anchor="middle" fill="#5856d6" opacity=".6" font-family="Helvetica">SEAL</text>';

}
const paperSVG=(type,k,vals)=>`<svg viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg">${paperInner(type,k,vals)}</svg>`;
function paperSlice(d){

 const boxes=vals.map(v=>clamp(40+v.length*9,90,260));
 return `<svg viewBox="0 78 300 158" xmlns="http://www.w3.org/2000/svg">${paperInner(d.type,d.pages[0]||1,vals,boxes)}</svg>`;
}
const clipPoly=c=>`polygon(${c.map(p=>p[0]+'% '+p[1]+'%').join(',')})`;

 const p=S.pages[pid];
 return `<div class="th ${cls}"><div class="sheet" style="clip-path:${clipPoly(p.crop)}">${paperSVG(p.type,p.id)}</div></div>`;

 const p=S.pages[S.cropId],box=$('#cbox');

  const c=p.crop;$('#poly').setAttribute('points',c.map(q=>q.join(',')).join(' '));

 };
 draw();
 $$('.hd',box).forEach(h=>h.addEventListener('pointerdown',e=>{
  const i=+h.dataset.h;h.setPointerCapture(e.pointerId);const r=box.getBoundingClientRect();
  const mv=ev=>{p.crop[i]=[clamp((ev.clientX-r.left)/r.width*100,0,100),clamp((ev.clientY-r.top)/r.height*100,0,100)].map(v=>Math.round(v*10)/10);draw()};
  h.addEventListener('pointermove',mv);h.addEventListener('pointerup',()=>h.removeEventListener('pointermove',mv),{once:true});
 }));
 $('#cauto').onclick=()=>{p.crop=AUTO.map(q=>q.slice());draw()};
 $('#cfull').onclick=()=>{p.crop=FULL.map(q=>q.slice());draw()};

 p._old=p.crop.map(q=>q.slice());

 $('#sendBtn')&&($('#sendBtn').onclick=send);$('#sendTop').onclick=send;

 $$('[data-att]').forEach(e=>e.onclick=()=>{const d=S.docs.find(x=>x.id===e.dataset.att);sheet('Attach this document to…',ATTACH.map(a=>({t:a,f:()=>{d.attach=a;render()}})))});

 $$('[data-fx]').forEach(b=>b.onclick=()=>{

 });

/* ---------- scan engine ---------- */
let scanT=[];
function stopScan(){scanT.forEach(clearTimeout);scanT=[]}
function later(f,ms){scanT.push(setTimeout(f,ms))}
function strip(){
 const s=$('#strip');if(!s)return;

 $$('[data-p]',s).forEach(e=>e.onclick=()=>go('crop',{cropId:+e.dataset.p,cropBack:'scan'}));
 s.scrollLeft=s.scrollWidth;$('#cnt').textContent=Object.keys(S.pages).length+' pages';
}
function newSheet(){
 const live=$('#live');if(!live)return;

 live.style.setProperty('--rot',(Math.random()*8-4).toFixed(1)+'deg');
 live.className='live in';$('#pap').innerHTML=paperSVG(S.cur,Math.floor(Math.random()*20));
 $('#quad').className='quad';$('#chip').textContent='Looking for edges…';
 later(()=>{const q=$('#quad');if(!q)return;q.classList.add('lock');$('#chip').textContent='Edges found · hold steady';armAuto()},900);
}
function armAuto(){if(!S.auto)return;later(()=>{if($('#quad')&&$('#quad').classList.contains('lock')&&S.auto)capture()},1300)}
function capture(){
 const live=$('#live');if(!live||live.classList.contains('out'))return;
 stopScan();
 $('#flash').classList.remove('go');void $('#flash').offsetWidth;$('#flash').classList.add('go');
 newPage(S.cur,AUTO);strip();toast('Page '+Object.keys(S.pages).length+' scanned');
 live.classList.remove('in');live.classList.add('out');
 later(newSheet,450);
}

/* ---------- send / sync ---------- */
function startSync(){
 S.loose.splice(0).forEach(id=>{const d=mkDoc(S.pages[id].type);d.pages.push(id)});
 const dr=S.docs.filter(d=>d.status==='draft'&&d.pages.length);
 if(!dr.length){toast('Nothing to send');return}
 dr.forEach(d=>{d.status='queued';d.done=0});
 go('sync');runSync();
}
async function runSync(){
 if(S.syncing)return;S.syncing=true;
 for(;;){
  const d=S.docs.find(x=>x.status==='queued');if(!d)break;
  d.status='uploading';
  for(let i=1;i<=d.pages.length;i++){d.done=i;upd();await sleep(550)}
  d.status='reading';upd();await sleep(1800+Math.random()*900);
  d.fields=TYPES[d.type].fields.map(f=>({label:f[0],value:f[1],conf:Math.max(70,f[2]-Math.floor(Math.random()*5))}));
  d.status='ready';upd();toast(TYPES[d.type].name+' is ready to review');
 }
 S.syncing=false;upd();
}

/* ---------- drag & drop ---------- */
function bindDrag(){
 $$('#screen .tile').forEach(t=>t.addEventListener('pointerdown',e=>{
  if(e.button)return;
  const sx=e.clientX,sy=e.clientY,id=+t.dataset.page,r=t.getBoundingClientRect();let ghost=null,moved=false,over=null;
  const mv=ev=>{
   const dx=ev.clientX-sx,dy=ev.clientY-sy;
   if(!moved&&Math.hypot(dx,dy)>8){moved=true;ghost=t.cloneNode(true);ghost.classList.add('ghost');ghost.style.width=r.width+'px';ghost.style.height=r.height+'px';document.body.appendChild(ghost);t.classList.add('lift')}
   if(moved){
    ghost.style.left=(ev.clientX-r.width/2)+'px';ghost.style.top=(ev.clientY-r.height/2)+'px';
    const el=document.elementFromPoint(ev.clientX,ev.clientY),z=el&&el.closest('[data-zone]');
    if(over!==z){over&&over.classList.remove('over');over=z;over&&over.classList.add('over')}
    const sc=$('#screen .scroll'),b=sc.getBoundingClientRect();
    if(ev.clientY<b.top+50)sc.scrollTop-=8;else if(ev.clientY>b.bottom-110)sc.scrollTop+=8;
   }
  };
  const done=()=>{window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',cancel)};
  const up=ev=>{
   done();
   if(!moved){go('crop',{cropId:id,cropBack:'pages'});return}
   ghost&&ghost.remove();dropPage(id,ev.clientX,ev.clientY);
  };
  const cancel=()=>{done();ghost&&ghost.remove();render()};
  e.preventDefault();
  window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up);window.addEventListener('pointercancel',cancel);
 }));
 $$('#screen .tile').forEach(t=>t.addEventListener('dragstart',e=>e.preventDefault()));
}
function dropPage(pid,x,y){
 const el=document.elementFromPoint(x,y),zone=el&&el.closest('[data-zone]');
 if(!zone){render();return}
 const tile=el.closest('.tile'),target=zone.dataset.zone;
 let arr;
 detach(pid);
 if(target==='new'){const d=mkDoc(S.pages[pid].type);arr=d.pages}
 else if(target==='loose')arr=S.loose;
 else arr=S.docs.find(d=>d.id===target).pages;
 let idx=arr.length;
 if(tile&&+tile.dataset.page!==pid){const ti=arr.indexOf(+tile.dataset.page);if(ti>=0){const r=tile.getBoundingClientRect();idx=x>r.left+r.width/2?ti+1:ti}}
 arr.splice(idx,0,pid);
 render();
}

/* ---------- review ---------- */
function bindReview(){
 const q=by('ready');if(!q.length)return;
 const top=$('.k0'),d=q[0];if(!top)return;
 const ok=$('.st-ok',top),no=$('.st-no',top),ed=$('.st-ed',top);
 let sx,sy,drag=false;
 top.addEventListener('pointerdown',e=>{drag=true;sx=e.clientX;sy=e.clientY;top.setPointerCapture(e.pointerId);top.style.transition='none'});
 top.addEventListener('pointermove',e=>{
  if(!drag)return;const dx=e.clientX-sx,dy=e.clientY-sy;
  top.style.transform=`translate(${dx}px,${dy}px) rotate(${dx/18}deg)`;
  ok.style.opacity=clamp(dx/110,0,1);no.style.opacity=clamp(-dx/110,0,1);ed.style.opacity=Math.abs(dx)<60?clamp(-dy/110,0,1):0;
 });
 const end=e=>{
  if(!drag)return;drag=false;const dx=e.clientX-sx,dy=e.clientY-sy;top.style.transition='';
  if(dx>100)decide(d,'right');else if(dx<-100)decide(d,'left');else if(dy<-100)decide(d,'up');
  else{top.style.transform='';ok.style.opacity=no.style.opacity=ed.style.opacity=0}
 };
 top.addEventListener('pointerup',end);top.addEventListener('pointercancel',end);
 $$('[data-act]').forEach(b=>b.onclick=()=>decide(d,b.dataset.act));
}
function decide(d,dir){
 const top=$('.k0');
 if(dir==='up'){
  if(top){top.style.transform='';$$('.stamp',top).forEach(s=>s.style.opacity=0)}
  editSheet(d);return;
 }
 if(top){top.style.transition='transform .3s,opacity .3s';top.style.transform=dir==='right'?'translate(480px,40px) rotate(24deg)':'translate(-480px,40px) rotate(-24deg)';top.style.opacity=0}
 setTimeout(()=>{
  if(dir==='right'){d.status='approved';S.approved++;toast('Approved. Sent to your system as a draft.')}
  else{d.status='issue';toast('Moved to Fix later. Nothing was deleted.')}
  render();
 },280);
}
function editSheet(d){
 const o=document.createElement('div');o.className='ovl';
 o.innerHTML=`<div class="edsheet"><div class="grab"></div><div class="nb"><button id="ec">Cancel</button><span class="mid">${TYPES[d.type].entity}</span><button id="es" style="font-weight:600">Approve</button></div><div class="sec n">Only the fields we need</div><div class="grp">${d.fields.map((f,i)=>`<div class="cell"><div class="tx">${f.label}</div><input data-i="${i}" value="${f.value.replace(/"/g,'&quot;')}"></div>`).join('')}</div><div class="sec n">Editing a value approves it with your correction.</div></div>`;
 $('#phone').appendChild(o);
 $('#ec',o).onclick=()=>o.remove();
 $('#es',o).onclick=()=>{$$('input',o).forEach(i=>{const f=d.fields[+i.dataset.i];if(f.value!==i.value){f.value=i.value;f.conf=100}});o.remove();decide(d,'right')};
 o.addEventListener('pointerdown',e=>{if(e.target===o)o.remove()});
}
function sheet(title,opts){
 const o=document.createElement('div');o.className='ovl';
 o.innerHTML=`<div class="as"><div class="asg"><div class="ash">${title}</div>${opts.map((x,i)=>`<button class="asb ${x.d?'dst':''}" data-i="${i}">${x.t}</button>`).join('')}</div><button class="asb cn">Cancel</button></div>`;
 $('#phone').appendChild(o);
 $$('[data-i]',o).forEach(b=>b.onclick=()=>{o.remove();opts[+b.dataset.i].f()});
 $('.cn',o).onclick=()=>o.remove();
 o.addEventListener('pointerdown',e=>{if(e.target===o)o.remove()});
}

/* ---------- fit to window ---------- */
render();
</script></body></html>
